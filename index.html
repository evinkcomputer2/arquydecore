<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejador 3D - Estilo Profissional Integrado</title>
    <!-- Vinculação correta do CSS externo -->
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="barra-superior">
        <button class="btn-topo ativo">Home</button>
        <button class="btn-topo" onclick="novoProjeto()">Novo Projeto</button>
        <button class="btn-topo" onclick="mostrarAviso('Andar térreo selecionado')">Andar Térreo</button>
        <button class="btn-icone-topo" onclick="salvarProjeto()">Salvar</button>
        <button class="btn-icone-topo" onclick="desfazerAcao()">Desfazer</button>
        <button class="btn-icone-topo" onclick="refazerAcao()">Refazer</button>
        <button class="btn-icone-topo" onclick="mostrarAviso('Ajuda aberta')">Ajuda</button>
    </div>

    <div class="menu-lateral">
        <button class="btn-lateral ativo" id="btnMenu2D" onclick="alternarSubmenu2D()" title="Planta">Planta</button>
        <button class="btn-lateral" onclick="mostrarAviso('Ferramenta Zoom')" title="Zoom">Zoom</button>
        <button class="btn-lateral" onclick="mostrarAviso('Móveis')" title="Móveis">Móv</button>
        <button class="btn-lateral" onclick="mostrarAviso('Favoritos')" title="Favoritos">Fav</button>
        <button class="btn-lateral" onclick="mostrarAviso('Catálogo')" title="Catálogo">Cat</button>
        <button class="btn-lateral" onclick="mostrarAviso('Medidas')" title="Medidas">Med</button>
        <button class="btn-lateral" onclick="mostrarAviso('Foto gerada')" title="Foto">Foto</button>
    </div>

    <div class="submenu-2d visivel" id="submenu2D">
        <strong style="font-size: 0.75rem; color: #666; margin-bottom: 4px; display:block;">Ferramentas 2D</strong>
        <button onclick="definirFerramenta('linha')">Desenhar Linhas</button>
        <button onclick="definirFerramenta('retangulo')">Criar Retângulo</button>
        <button onclick="limparAmbiente2D()">Reiniciar Planta</button>
    </div>

    <div class="painel-medidas" id="painelMedidas">
        <h4>Sala 1 - Planta 2D</h4>
        <div class="info-linha">Área Total: <span id="valArea">20.00 m²</span></div>
        <div class="info-linha">Comprimento: <span id="valComp">560 cm</span></div>
        <div class="info-linha">Largura: <span id="valLarg">357 cm</span></div>
    </div>

    <div id="area3d"></div>

    <div class="barra-inferior">
        <div class="grupo-controles">
            <button class="btn-inf" onclick="mostrarAviso('Configurações')">Config</button>
        </div>
        <div class="grupo-controles">
            <button class="btn-inf ativo" id="modo2DBtn" onclick="mudarModoVisualizacao('2d')">2D</button>
            <button class="btn-inf" id="modo3DBtn" onclick="mudarModoVisualizacao('3d')">3D</button>
            <button class="btn-inf" onclick="focarAvatar()">Avatar</button>
        </div>
        <div class="grupo-controles">
            <button class="btn-inf" onclick="ajustarZoom(0.8)">Mais</button>
            <button class="btn-inf" onclick="ajustarZoom(1.25)">Menos</button>
        </div>
    </div>

    <div id="notificacao">Notificação</div>

    <!-- Vinculação correta do JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
