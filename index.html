<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto de Cômodo</title>
    <link rel="stylesheet" href="style.css">

    <!-- Bibliotecas do Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Barra Lateral -->
    <div class="sidebar">
        <h2>Projeto de cômodo</h2>

        <div class="form-group">
            <h3>Dimensões do Ambiente (Metros)</h3>
            <label>Largura:</label>
            <input type="number" id="inputLargura" value="10" min="1" max="50" oninput="atualizarAmbiente()">
            
            <label style="margin-top: 5px;">Comprimento:</label>
            <input type="number" id="inputComprimento" value="8" min="1" max="50" oninput="atualizarAmbiente()">
        </div>

        <div>
            <h3>Adicionar Móveis</h3>
            <div class="grid-moveis">
                <button class="btn-movel" onclick="adicionarMovel('cama')">🛏️ Cama</button>
                <button class="btn-movel" onclick="adicionarMovel('sofa')">🛋️ Sofá</button>
                <button class="btn-movel" onclick="adicionarMovel('mesa')">🪵 Mesa</button>
                <button class="btn-movel" onclick="adicionarMovel('cadeira')">chair️ Cadeira</button>
                <button class="btn-movel btn-full" onclick="adicionarMovel('armario')">🚪 Armário</button>
            </div>
        </div>

        <div>
            <h3>Personalização</h3>
            <label>Cor Principal do Móvel:</label>
            <input type="color" id="corMovel" value="#8d6e63">
        </div>

        <button class="btn-acao" onclick="alternarVisao()">Alternar Visão (2D / 3D)</button>
    </div>

    <!-- Área Gráfica 3D / 2D -->
    <div class="main-content">
        <div class="top-right-bar" id="modoTexto">Modo: 2D (Planta Baixa)</div>
        <div id="area3d"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
