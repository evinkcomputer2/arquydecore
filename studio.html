<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVAÉ Studio — 3D Interativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <!-- Three.js e OrbitControls para movimentação livre da câmera -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #18181b;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* TELA DE CONFIGURAÇÃO INICIAL */
        #setup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .setup-card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .setup-card h2 {
            margin-bottom: 8px;
            font-size: 22px;
            font-weight: 700;
        }

        .setup-card p {
            color: #71717a;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .setup-card label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #3f3f46;
            text-transform: uppercase;
        }

        .setup-card select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
            font-size: 15px;
            background: #fafafa;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #18181b;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #27272a;
        }

        /* BARRA SUPERIOR */
        .top-toolbar {
            height: 60px;
            background: #fff;
            border-bottom: 1px solid #e4e4e7;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 10px;
            z-index: 10;
        }

        .tool-btn {
            background: #fff;
            border: 1px solid #e4e4e7;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #3f3f46;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #f4f4f5;
        }

        /* LAYOUT PRINCIPAL (BARRA LATERAL + PALCO 3D) */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        sidebar {
            width: 280px;
            background: #fff;
            border-right: 1px solid #e4e4e7;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            z-index: 5;
        }

        sidebar h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #71717a;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .furniture-card {
            background: #fafafa;
            border: 1px solid #e4e4e7;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 14px;
            color: #27272a;
            transition: all 0.2s;
        }

        .furniture-card:hover {
            background: #f0f0f3;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .furniture-card i {
            color: #4f46e5;
            font-size: 16px;
        }

        /* CANVAS 3D */
        #canvas-container {
            flex: 1;
            position: relative;
            background: #f4f4f5;
        }

        /* ALTERNADOR DE VISTA 2D / 3D */
        .view-switcher {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .view-btn {
            padding: 8px 20px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            color: #71717a;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: #18181b;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- TELA DE CONFIGURAÇÃO -->
    <div id="setup-screen">
        <div class="setup-card">
            <h2>NOVAÉ Studio 3D</h2>
            <p>Selecione o ambiente e as dimensões do cômodo.</p>
            
            <label>Ambiente</label>
            <select id="room-type">
                <option value="Quarto">Quarto</option>
                <option value="Sala de Estar">Sala de Estar</option>
                <option value="Cozinha">Cozinha</option>
            </select>

            <label>Tamanho (Metros)</label>
            <select id="room-size">
                <option value="4">4m × 4m (Padrão)</option>
                <option value="5">5m × 5m (Espaçoso)</option>
                <option value="6">6m × 6m (Grande)</option>
            </select>

            <button class="btn-primary" onclick="initStudio()">Iniciar Projeto 3D</button>
        </div>
    </div>

    <!-- BARRA SUPERIOR -->
    <header class="top-toolbar">
        <button class="tool-btn" onclick="location.reload()"><i class="fa-solid fa-house"></i> Início</button>
        <button class="tool-btn"><i class="fa-solid fa-bars"></i> Novo projeto</button>
        <div style="flex: 1; text-align: center; font-weight: 600; color: #52525b; font-size: 14px;" id="project-title">Projeto: Quarto (5x5m)</div>
        <button class="tool-btn" style="background: #18181b; color: #fff; border: none;" onclick="alert('Projeto pronto para salvar no Firebase!')"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
    </header>

    <!-- LAYOUT COM BARRA LATERAL E PALCO 3D -->
    <div class="main-layout">
        <sidebar>
            <h3>Mobília Realista 3D</h3>
            <div class="furniture-card" onclick="addFurniture('sofa')">
                <i class="fa-solid fa-couch"></i> Sofá 3 Lugares
            </div>
            <div class="furniture-card" onclick="addFurniture('bed')">
                <i class="fa-solid fa-bed"></i> Cama de Casal
            </div>
            <div class="furniture-card" onclick="addFurniture('tv_rack')">
                <i class="fa-solid fa-tv"></i> Rack / Painel TV
            </div>
            <div class="furniture-card" onclick="addFurniture('table')">
                <i class="fa-solid fa-utensils"></i> Mesa de Jantar
            </div>
            <div class="furniture-card" onclick="addFurniture('armchair')">
                <i class="fa-solid fa-chair"></i> Poltrona Elegance
            </div>
        </sidebar>

        <div id="canvas-container"></div>
    </div>

    <!-- ALTERNADOR 2D / 3D -->
    <div class="view-switcher">
        <button class="view-btn" onclick="setView('2D')">2D</button>
        <button class="view-btn active" onclick="setView('3D')">3D</button>
    </div>

    <script>
        let scene, camera, renderer, controls, roomSize = 5;

        function initStudio() {
            const type = document.getElementById('room-type').value;
            roomSize = parseInt(document.getElementById('room-size').value);
            document.getElementById('project-title').innerText = `Projeto: ${type} (${roomSize}x${roomSize}m)`;
            document.getElementById('setup-screen').style.display = 'none';
            
            setup3DScene();
        }

        function setup3DScene() {
            const container = document.getElementById('canvas-container');

            // 1. Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf1f1f3);

            // 2. Câmera
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 8, 10);

            // 3. Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. OrbitControls (Movimentação livre estilo HomeByMe: girar, dar zoom e arrastar)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Impede a câmera de ir abaixo do chão

            // 5. Luzes realistas
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 6. Grid técnico de fundo
            const gridHelper = new THREE.GridHelper(40, 40, 0xcccccc, 0xe5e7eb);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            // 7. Piso de Madeira Realista
            const floorGeo = new THREE.PlaneGeometry(roomSize, roomSize);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0xc89d7c, 
                roughness: 0.35 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 8. Paredes translúcidas
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                transparent: true, 
                opacity: 0.2, 
                side: THREE.DoubleSide 
            });
            
            const wallBack = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, 2.5), wallMat);
            wallBack.position.set(0, 1.25, -roomSize/2);
            scene.add(wallBack);

            const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, 2.5), wallMat);
            wallLeft.rotation.y = Math.PI / 2;
            wallLeft.position.set(-roomSize/2, 1.25, 0);
            scene.add(wallLeft);

            animate();
        }

        // Função para criar móveis detalhados e realistas em 3D
        function addFurniture(type) {
            const group = new THREE.Group();

            if (type === 'sofa') {
                // Base do sofá
                const baseGeo = new THREE.BoxGeometry(1.8, 0.4, 0.8);
                const mat = new THREE.MeshStandardMaterial({ color: 0x3f3f46, roughness: 0.8 });
                const base = new THREE.Mesh(baseGeo, mat);
                base.position.y = 0.2;
                group.add(base);

                // Assentos
                const seatGeo = new THREE.BoxGeometry(1.7, 0.2, 0.75);
                const seatMat = new THREE.MeshStandardMaterial({ color: 0x71717a, roughness: 0.6 });
                const seat = new THREE.Mesh(seatGeo, seatMat);
                seat.position.set(0, 0.5, 0.02);
                group.add(seat);

                // Encosto
                const backGeo = new THREE.BoxGeometry(1.8, 0.7, 0.2);
                const back = new THREE.Mesh(backGeo, mat);
                back.position.set(0, 0.85, -0.3);
                group.add(back);
            } 
            else if (type === 'bed') {
                // Estrutura Cama
                const bedGeo = new THREE.BoxGeometry(1.4, 0.4, 1.9);
                const bedMat = new THREE.MeshStandardMaterial({ color: 0x52525b });
                const bedBase = new THREE.Mesh(bedGeo, bedMat);
                bedBase.position.y = 0.2;
                group.add(bedBase);

                // Colchão
                const mattressGeo = new THREE.BoxGeometry(1.35, 0.3, 1.85);
                const mattressMat = new THREE.MeshStandardMaterial({ color: 0xf4f4f5, roughness: 0.9 });
                const mattress = new THREE.Mesh(mattressGeo, mattressMat);
                mattress.position.y = 0.5;
                group.add(mattress);

                // Cabeceira
                const headGeo = new THREE.BoxGeometry(1.4, 1.0, 0.1);
                const head = new THREE.Mesh(headGeo, bedMat);
                head.position.set(0, 0.5, -0.95);
                group.add(head);
            }
            else if (type === 'tv_rack') {
                const rackGeo = new THREE.BoxGeometry(1.5, 0.45, 0.45);
                const rackMat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.5 });
                const rack = new THREE.Mesh(rackGeo, rackMat);
                rack.position.y = 0.22;
                group.add(rack);
            }
            else if (type === 'table') {
                const tableGeo = new THREE.BoxGeometry(1.4, 0.08, 0.8);
                const tableMat = new THREE.MeshStandardMaterial({ color: 0xa16207, roughness: 0.4 });
                const top = new THREE.Mesh(tableGeo, tableMat);
                top.position.y = 0.75;
                group.add(top);

                // Pés da mesa
                const legGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.75);
                const legMat = new THREE.MeshStandardMaterial({ color: 0x18181b });
                
                [-0.6, 0.6].forEach(x => {
                    [-0.3, 0.3].forEach(z => {
                        const leg = new THREE.Mesh(legGeo, legMat);
                        leg.position.set(x, 0.375, z);
                        group.add(leg);
                    });
                });
            }
            else if (type === 'armchair') {
                const seatGeo = new THREE.BoxGeometry(0.8, 0.4, 0.8);
                const mat = new THREE.MeshStandardMaterial({ color: 0x4f46e5 });
                const seat = new THREE.Mesh(seatGeo, mat);
                seat.position.y = 0.2;
                group.add(seat);

                const backGeo = new THREE.BoxGeometry(0.8, 0.7, 0.2);
                const back = new THREE.Mesh(backGeo, mat);
                back.position.set(0, 0.75, -0.3);
                group.add(back);
            }

            // Posiciona o móvel gerado aleatoriamente dentro do cômodo
            group.position.set((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2);
            scene.add(group);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function setView(mode) {
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === '2D') {
                camera.position.set(0, 12, 0.001);
                controls.target.set(0, 0, 0);
            } else {
                camera.position.set(0, 8, 10);
                controls.target.set(0, 0, 0);
            }
        }

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                const container = document.getElementById('canvas-container');
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }
        });
    </script>
</body>
</html>
