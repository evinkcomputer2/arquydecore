<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVAÉ Studio — 3D Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <!-- Biblioteca Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #18181b;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* TELA DE CONFIGURAÇÃO INICIAL */
        #setup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .setup-card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .setup-card h2 {
            margin-bottom: 8px;
            font-size: 22px;
            font-weight: 700;
        }

        .setup-card p {
            color: #71717a;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .setup-card label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #3f3f46;
            text-transform: uppercase;
        }

        .setup-card select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
            font-size: 15px;
            background: #fafafa;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #18181b;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #27272a;
        }

        /* BARRA SUPERIOR ESTILO HOMEBYME */
        .top-toolbar {
            height: 60px;
            background: #fff;
            border-bottom: 1px solid #e4e4e7;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 10px;
            z-index: 10;
        }

        .tool-btn {
            background: #fff;
            border: 1px solid #e4e4e7;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #3f3f46;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #f4f4f5;
        }

        .tool-btn.active-yellow {
            background: #ffeb3b;
            border-color: #fbc02d;
            color: #000;
        }

        /* ÁREA DE RENDERIZAÇÃO 3D */
        #canvas-container {
            flex: 1;
            width: 100%;
            position: relative;
        }

        /* ALTERNADOR DE VISTA 2D / 3D INFERIOR */
        .view-switcher {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .view-btn {
            padding: 8px 20px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            color: #71717a;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: #18181b;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- TELA DE CONFIGURAÇÃO INICIAL -->
    <div id="setup-screen">
        <div class="setup-card">
            <h2>NOVAÉ Studio 3D</h2>
            <p>Selecione o tipo de ambiente e as dimensões do cômodo.</p>
            
            <label>Ambiente</label>
            <select id="room-type">
                <option value="Sala de Estar">Sala de Estar</option>
                <option value="Quarto">Quarto</option>
                <option value="Cozinha">Cozinha</option>
            </select>

            <label>Tamanho (Metros)</label>
            <select id="room-size">
                <option value="4">4m × 4m (Padrão)</option>
                <option value="5">5m × 4m (Retangular)</option>
                <option value="6">6m × 5m (Grande)</option>
            </select>

            <button class="btn-primary" onclick="initStudio()">Criar Ambiente 3D</button>
        </div>
    </div>

    <!-- BARRA SUPERIOR -->
    <header class="top-toolbar">
        <button class="tool-btn active-yellow" onclick="location.reload()"><i class="fa-solid fa-house"></i></button>
        <button class="tool-btn"><i class="fa-solid fa-bars"></i> Novo projeto</button>
        <button class="tool-btn"><i class="fa-solid fa-layer-group"></i> Andar térreo</button>
        <div style="flex: 1; text-align: center; font-weight: 600; color: #52525b; font-size: 14px;" id="project-title">Projeto: Sala de Estar (4x4m)</div>
        <button class="tool-btn" style="background: #18181b; color: #fff; border: none;" onclick="salvarFirebase()"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
    </header>

    <!-- CONTAINER 3D -->
    <div id="canvas-container"></div>

    <!-- BARRA 2D / 3D -->
    <div class="view-switcher">
        <button class="view-btn" onclick="setView('2D')">2D</button>
        <button class="view-btn active" onclick="setView('3D')">3D</button>
    </div>

    <script>
        let scene, camera, renderer, roomSize = 4;

        function initStudio() {
            const type = document.getElementById('room-type').value;
            roomSize = parseInt(document.getElementById('room-size').value);
            document.getElementById('project-title').innerText = `Projeto: ${type} (${roomSize}x${roomSize}m)`;
            document.getElementById('setup-screen').style.display = 'none';
            
            setup3DScene();
        }

        function setup3DScene() {
            const container = document.getElementById('canvas-container');

            // 1. Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8f9fa);

            // 2. Câmera
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 8, 10);
            camera.lookAt(0, 0, 0);

            // 3. Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // 4. Luzes
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // 5. Grid de Fundo (Piso Técnico)
            const gridHelper = new THREE.GridHelper(30, 30, 0xdddddd, 0x11111122);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            // 6. Piso de Madeira Realista do Cômodo
            const floorGeo = new THREE.PlaneGeometry(roomSize, roomSize);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0xd7ccc8, // Tom amadeirado claro
                roughness: 0.5 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 7. Paredes Translúcidas Estilo HomeByMe
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                transparent: true, 
                opacity: 0.25, 
                side: THREE.DoubleSide 
            });
            
            const wallBack = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, 2.5), wallMat);
            wallBack.position.set(0, 1.25, -roomSize/2);
            scene.add(wallBack);

            const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, 2.5), wallMat);
            wallLeft.rotation.y = Math.PI / 2;
            wallLeft.position.set(-roomSize/2, 1.25, 0);
            scene.add(wallLeft);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function setView(mode) {
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === '2D') {
                camera.position.set(0, 12, 0.001); // Visão superior estilo planta baixa
                camera.lookAt(0, 0, 0);
            } else {
                camera.position.set(0, 8, 10); // Visão perspectiva 3D
                camera.lookAt(0, 0, 0);
            }
        }

        function salvarFirebase() {
            alert("Dados do projeto (" + roomSize + "m) prontos para salvar no Firebase!");
        }

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                const container = document.getElementById('canvas-container');
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }
        });
    </script>
</body>
</html>
